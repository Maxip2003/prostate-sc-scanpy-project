dataset:
  input_path: "data/data_full.h5ad"
  output_dir: "data"                       # where intermediate .h5ad files are saved
  db_path: "databases/prostate.duckdb"     # where the database lives
  accession: "68b23fda-7191-46a5-8870-819feca3e66e"
  source_url: "https://cellxgene.cziscience.com/collections/bdac7a53-fe34-4f04-8c46-f9bd5297c099"
  download_date: "07/09/2026"
  n_cells_raw: 68322

qc:
  min_genes: 500        # cells below this many detected genes are dropped (low quality)
  max_genes: 7000        # cells above this many are dropped (likely doublets)
  max_pct_mt: 20          # cells above this % mitochondrial reads are dropped

clustering:
  n_pcs: 12                # number of principal components used for neighbors/clustering
  leiden_resolution: 1.0

sanity_check:
  positive_control_gene: KLK3   # known marker used to validate clustering before trusting results